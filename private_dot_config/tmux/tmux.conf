set-option -g default-shell /bin/zsh

# ============================================================================
# General Settings
# ============================================================================

set-option -g prefix C-a
unbind C-b
bind-key a send-prefix          # C-a a sends C-a to the terminal

set -g mouse on
set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g focus-events on
setw -g aggressive-resize on
setw -g monitor-activity on
set -g visual-activity on
set-window-option -g automatic-rename
set-window-option -g alternate-screen off
set-window-option -g mode-keys vi

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# ============================================================================
# Key Bindings
# ============================================================================

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

# Splits (preserve current path)
bind v split-window -h -c "#{pane_current_path}"
bind b split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window preserves current path
unbind c
bind c new-window -c "#{pane_current_path}"

# Pane navigation
bind-key Left  select-pane -L
bind-key Down  select-pane -D
bind-key Up    select-pane -U
bind-key Right select-pane -R

# Pane resizing
bind-key C-Left  resize-pane -L 10
bind-key C-Down  resize-pane -D 10
bind-key C-Up    resize-pane -U 10
bind-key C-Right resize-pane -R 10

# Window switching
bind C-p previous-window
bind C-n next-window
bind C-a last-window

# Named new window
bind-key C command-prompt -p "Name of new window: " "new-window -n '%%'"

# Main-horizontal layout (60% main pane)
bind m set-window-option main-pane-height 60\; select-layout main-horizontal

# Dev launcher: Neovim top, Claude Code bottom
bind D split-window -v -p 40 \; send-keys 'claude' C-m \; select-pane -U \; send-keys 'nvim' C-m

# ============================================================================
# Vi Copy Mode
# ============================================================================

bind Escape copy-mode
bind p paste-buffer
bind + delete-buffer
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# ============================================================================
# Colors — elflord Theme
# ============================================================================
# Palette:
#   bg: colour235    keywords: colour51 (cyan)    strings: colour226 (yellow)
#   fg: colour255    comments: colour46 (green)   special: colour201 (magenta)

set -g status-style           bg=colour235,fg=colour46
set -g status-left-style      fg=colour51,bold
set -g status-right-style     fg=colour226

setw -g window-status-style          fg=colour250,bg=colour235
setw -g window-status-current-style  fg=colour51,bold,bg=colour236
setw -g window-status-activity-style fg=colour226,bg=colour235

set -g pane-border-style        fg=colour240
set -g pane-active-border-style fg=colour46,bold
set -g pane-border-lines        heavy
set -g pane-border-status       top
set -g pane-border-format       " #[fg=colour250]#P: #[fg=colour46,bold]#{pane_current_command} #[fg=colour240]#{pane_current_path} "

set -g window-style        fg=colour247,bg=colour235
set -g window-active-style fg=colour255,bg=colour234

set -g message-style         bg=colour46,fg=colour232,bold
set -g message-command-style bg=colour51,fg=colour232

# ============================================================================
# Status Bar
# ============================================================================

set -g status-interval      1
set -g status-justify       centre
set -g status-left-length   20
set -g status-right-length  140
set -g status-left          "#[fg=colour51,bold] ❐ #S #[fg=colour240]│ "
set -g status-right         "#[fg=colour46]#H #[fg=colour240]│ #[fg=colour226]%Y-%m-%d %H:%M:%S "
set -g window-status-format         "#[fg=colour250] #I:#W "
set -g window-status-current-format "#[fg=colour51,bold] #I:#W "

# ============================================================================
# Popups
# ============================================================================

bind C-j display-popup -d "#{pane_current_path}" -w 95% -h 95% -E "lazyjj"
bind C-s display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
bind C-l display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
bind C-r display-popup -E "ipython"
bind C-f display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "ranger"
bind C-z display-popup -w 95% -h 95% -E 'nvim ~/.zshrc'
bind C-g display-popup -E "GEMINI_API_KEY=\$GEMINI_API_KEY; gemini"
bind C-t display-popup -d "#{pane_current_path}" -w 75% -h 75% -E "zsh"

# ============================================================================
# Menu
# ============================================================================

bind C-m display-menu -T "#[align=centre]Dotfiles" -x C -y C \
  "zshrc"      z "display-popup -w 95% -h 95% -E 'nvim ~/.zshrc'" \
  "tmux.conf"  t "display-popup -w 95% -h 95% -E 'nvim ~/.config/tmux/tmux.conf'" \
  "Exit"       q ""

# ============================================================================
# Plugins (TPM)
# ============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

run '~/.tmux/plugins/tpm/tpm'
