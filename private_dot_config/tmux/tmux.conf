set-option -g default-shell /bin/zsh

# ============================================================================
# elflord Theme Colors
# ============================================================================
# elflord uses these colors:
# - Background: black/dark grey
# - Foreground: white
# - Keywords: bright cyan (#00ffff / colour51)
# - Strings: bright yellow (#ffff00 / colour226)
# - Comments: bright green (#00ff00 / colour46)
# - Special: bright magenta (#ff00ff / colour201)

# Status bar styling (elflord-inspired)
set -g status-style bg=colour235,fg=colour46  # Dark bg, bright green text
set -g status-left-style fg=colour51,bold     # Cyan for left status
set -g status-right-style fg=colour226        # Yellow for right status

# set window split
bind-key v split-window -h
bind-key b split-window

# default window title colors
# tokyo night theme
#set -g @plugin "janoamaral/tokyo-night-tmux"
#set -g @tokyo-night-tmux-theme "dark"
#set -g @tokyo-night-tmux_window_id_style digital
#set -g @tokyo-night-tmux_pane_id_style hsquare
#set -g @tokyo-night-tmux_zoom_id_style dsquare
# Icon styles
#set -g @tokyo-night-tmux_terminal_icon 
#set -g @tokyo-night-tmux_active_terminal_icon 

# No extra spaces between icons
#set -g @tokyo-night-tmux_window_tidy_icons 0


# Window status styling (elflord theme)
setw -g window-status-style fg=colour250,bg=colour235
setw -g window-status-current-style fg=colour51,bold,bg=colour236
setw -g window-status-activity-style fg=colour226,bg=colour235

# Pane borders - VERY visible active pane (elflord theme)
set -g pane-border-style fg=colour240           # Dim grey for inactive
set -g pane-active-border-style fg=colour46,bold # Bright green for active (matches elflord comments)
set -g pane-border-lines heavy                   # Thicker borders

# Show pane info in borders
set -g pane-border-status top
set -g pane-border-format " #[fg=colour250]#P: #[fg=colour46,bold]#{pane_current_command} #[fg=colour240]#{pane_current_path} "

# Dim inactive panes slightly (subtle but effective)
set -g window-style fg=colour247,bg=colour235
set -g window-active-style fg=colour255,bg=colour234

# Message styling (when you see command output) - elflord theme
set -g message-style bg=colour46,fg=colour232,bold
set -g message-command-style bg=colour51,fg=colour232


set -g status-interval 1
set -g status-justify centre # center align window list
set -g status-left-length 20
set -g status-right-length 140
# Left status: session name in cyan (elflord theme)
set -g status-left "#[fg=colour51,bold] ❐ #S #[fg=colour240]│ "

# Right status: date/time in yellow, host in green (elflord theme)
set -g status-right "#[fg=colour46]#H #[fg=colour240]│ #[fg=colour226]%Y-%m-%d %H:%M:%S "

# C-a is preferred as it's in the home row, less reach
# and I'm used to it from screen.

unbind C-b
set-option -g prefix C-a
bind-key C-a last-window
bind-key a send-prefix # enables sending a ctrl-a to the tmux session

# Start numbering at 1
set -g base-index 1
set -g pane-base-index 1

# Allows for faster key repetition
set -s escape-time 0

# Rather than constraining window size to the maximum size of any client 
# connected to the *session*, constrain window size to the maximum size of any 
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on



# Activity monitoring
setw -g monitor-activity on
set -g visual-activity on

# Vi copypaste mode
set-window-option -g mode-keys vi
setw -g mode-keys vi # vim-style movement

# in normal tmux mode
bind Escape copy-mode # `tmux prefix + Escape` starts copy mode.
bind p paste-buffer # `prefix + p` pastes the latest buffer
#
# # in copy mode…
bind-key -T copy-mode-vi 'v' send -X begin-selection # `v` begins a selection. (movement keys to select the desired bits)
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel # `v` begins a selection. (movement keys to select the desired bits)
#bind-key-t vi-copy y copy-selection # `y` copies the current selection to one of tmux's "paste buffers"
#bind-key -t vi-copy V rectangle-toggle # `V` changes between line- and columnwise selection
#
#bind-key -t vi-copy Y copy-end-of-line # ^1
bind + delete-buffer

# I use Colemak so have the hjkl keys out of place.
# I have a layer key modify the keys in their place to achieve
# hjkl movement with my muscle memory.
# Opted to map arrow keys rather than hjkl to make it work with a
# broader set of applications. TBD.

# hjkl pane traversal
bind-key Left select-pane -L
bind-key Down select-pane -D
bind-key Up select-pane -U
bind-key Right select-pane -R

# hjkl pane resize
bind-key C-Left resize-pane -L 20
bind-key C-Down resize-pane -D 20
bind-key C-Up resize-pane -U 20
bind-key C-Right resize-pane -R 20

# switch windows
bind C-p previous-window
bind C-n next-window

# set to main-horizontal, 60% height for main pane
bind m set-window-option main-pane-height 60\; select-layout main-horizontal

bind-key C command-prompt -p "Name of new window: " "new-window -n '%%'"

# reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

# auto window rename
set-window-option -g automatic-rename

# make things not clear screen
set-window-option -g alternate-screen off

# rm mouse mode fail
set -g mouse on
set -g terminal-overrides 'xterm*:smcup@:rmcup@'

# color
#set -g default-terminal "xterm"
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ',XXX:RGB'
  
##### Display Popups 
#https://github.com/ericmckevitt/Dotfiles/blob/main/tmux.conf  ##### 

bind C-j display-popup \
  -d "#{pane_current_path}" \
  -w 95% \
  -h 95% \
  -E "lazyjj"
bind C-s display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
bind C-l display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
bind C-r display-popup -E "ipython"
# bind C-f display-popup \
#  -w 80% \
#  -h 80% \
#  -E 'rmpc' # audio player that works with mdp
bind C-f display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E "ranger"
bind C-z display-popup \
  -w 95% \
  -h 95% \
  -E 'nvim ~/.zshrc'
bind C-g display-popup -E "GEMINI_API_KEY=\\$GEMINI_API_KEY; gemini"
bind C-t display-popup \
  -d "#{pane_current_path}" \
  -w 75% \
  -h 75% \
  -E "zsh"

##### Display Menu ##### 

bind C-m display-menu -T "#[align=centre]Dotfiles" -x C -y C \
  "zshrc"            z  "display-popup -w 95% -h 95% -E 'nvim ~/.zshrc'" \
  "tmux.conf"        t  "display-popup -w 95% -h 95% -E 'nvim ~/.config/tmux/tmux.conf'" \
  "Exit"              q  ""


# status bar
#set-option -g status-utf8 on

# https://github.com/edkolev/dots/blob/master/tmux.conf
# Updates for tmux 1.9's current pane splitting paths.

# from powerline
run-shell "tmux set-environment -g TMUX_VERSION_MAJOR $(tmux -V | cut -d' ' -f2 | cut -d'.' -f1 | sed 's/[^0-9]*//g')"
run-shell "tmux set-environment -g TMUX_VERSION_MINOR $(tmux -V | cut -d' ' -f2 | cut -d'.' -f2 | sed 's/[^0-9]*//g')"

if-shell '[$TMUX_VERSION_MAJOR -gt 1 -o \( $TMUX_VERSION_MAJOR -eq 1 -a $TMUX_VERSION_MINOR -ge 8 \)]' 'unbind c; bind c new-window -c "#{pane_current_path}"'
if-shell '[$TMUX_VERSION_MAJOR -gt 1 -o \( $TMUX_VERSION_MAJOR -eq 1 -a $TMUX_VERSION_MINOR -ge 8 \)]' 'unbind s; bind s split-window -v -c "#{pane_current_path}"'
if-shell '[$TMUX_VERSION_MAJOR -gt 1 -o \( $TMUX_VERSION_MAJOR -eq 1 -a $TMUX_VERSION_MINOR -ge 8 \)]' "unbind '\"'; bind '\"' split-window -v -c '#{pane_current_path}'"
if-shell '[$TMUX_VERSION_MAJOR -gt 1 -o \( $TMUX_VERSION_MAJOR -eq 1 -a $TMUX_VERSION_MINOR -ge 8 \)]' 'unbind v; bind v split-window -h -c "#{pane_current_path}"'
if-shell '[$TMUX_VERSION_MAJOR -gt 1 -o \( $TMUX_VERSION_MAJOR -eq 1 -a $TMUX_VERSION_MINOR -ge 8 \)]' 'unbind %; bind % split-window -h -c "#{pane_current_path}"'

# initialize sessions
#bind S source-file ~/.tmux/session1
#bind s source-file ~/.tmus/session2

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
